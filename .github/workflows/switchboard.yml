# switchboard 플러그인 검사(#157): 코어·어댑터·패널 시험(claude plugin test), MCP 서버 시험(node --test),
# 질문 경로 e2e(실제 switchboard 서버 고정 판 릴리스 + 플러그인 코어). 어느 쪽이든 시험이 0개 돌면 실패다.
# GitHub-hosted runner 만 쓴다. secret 과 pull_request_target 은 쓰지 않는다.
name: switchboard

on:
  pull_request:
    paths:
      - plugins/switchboard/**
      - .github/workflows/switchboard.yml
  push:
    branches: [main]
    paths:
      - plugins/switchboard/**
      - .github/workflows/switchboard.yml

permissions:
  contents: read

concurrency:
  group: switchboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  switchboard:
    name: switchboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Claude Code(plugin test 실행기)
        run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.327
      - name: mod 시험(claude plugin test)
        run: bash plugins/switchboard/e2e/suite.sh mod
      - name: MCP 서버 시험(node --test)
        run: bash plugins/switchboard/e2e/suite.sh mcp
      - name: 질문 경로 e2e(실제 서버)
        run: bash plugins/switchboard/e2e/run.sh
